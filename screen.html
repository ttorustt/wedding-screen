<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wedding Screen Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #bg {
      position: fixed;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 0;
    }

    #debug {
      position: fixed;
      z-index: 10;
      left: 20px;
      right: 20px;
      bottom: 20px;
      padding: 20px;
      background: rgba(0,0,0,.8);
      color: #fff;
      font-size: 18px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div id="bg"></div>
  <div id="debug">Загрузка...</div>

  <script>
    const bg = document.getElementById("bg");
    const debug = document.getElementById("debug");

    async function test() {
      try {
        const response = await fetch("/api/public-state?test=" + Date.now(), {
          cache: "no-store"
        });

        const state = await response.json();

        debug.innerHTML =
          "BACKGROUND URL:<br><br>" +
          (state.background || "ПУСТО");

        if (state.background) {
          bg.style.backgroundImage =
            'url("' + state.background + '")';
        }

      } catch (error) {
        debug.innerHTML =
          "ОШИБКА:<br><br>" + error.message;
      }
    }

    test();
  </script>

</body>
</html>
