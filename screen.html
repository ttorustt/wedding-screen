<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wedding Screen</title>

  <link rel="stylesheet" href="/app.css">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #backgroundImage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, .08),
          rgba(0, 0, 0, .30)
        );
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 7vw;
      pointer-events: none;
    }

    .halo {
      position: absolute;
      width: 76vw;
      height: 46vw;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse,
          rgba(0, 0, 0, .36),
          transparent 68%
        );
      filter: blur(24px);
      opacity: 0;
      transition: opacity .8s ease;
    }

    .stage.has-message .halo {
      opacity: 1;
    }

    .message-wrap {
      position: relative;
      max-width: 1500px;
      width: 100%;
      text-align: center;
    }

    .message {
      color: #fff;

      font:
        500 clamp(52px, 7vw, 132px) / 1
        "Cormorant Garamond",
        Georgia,
        serif;

      text-wrap: balance;

      text-shadow:
        0 5px 22px rgba(0,0,0,.42),
        0 10px 60px rgba(0,0,0,.55);

      opacity: 0;

      transform:
        translateY(40px)
        scale(.97);

      filter: blur(12px);

      transition:
        opacity .85s cubic-bezier(.16,1,.3,1),
        transform 1s cubic-bezier(.16,1,.3,1),
        filter .85s ease;
    }

    .message::before,
    .message::after {
      position: relative;
      font-size: .43em;
      opacity: .55;
    }

    .message::before {
      content: "“";
      top: -.5em;
      margin-right: .08em;
    }

    .message::after {
      content: "”";
      top: .08em;
      margin-left: .08em;
    }

    .message.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .message.hide {
      opacity: 0;
      transform: translateY(-26px) scale(1.015);
      filter: blur(10px);
    }

    .rule {
      width: 0;
      height: 1px;
      margin: 34px auto 0;
      background: rgba(255,255,255,.58);

      transition:
        width 1.1s .25s cubic-bezier(.16,1,.3,1),
        opacity .4s ease;
    }

    .message.show + .rule {
      width: min(240px, 22vw);
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;

      box-shadow:
        inset 0 0 170px rgba(0,0,0,.30);
    }

    @media (max-aspect-ratio: 4/3) {
      .message {
        font-size: clamp(46px, 8vw, 104px);
      }
    }
  </style>
</head>

<body>

  <img
    id="backgroundImage"
    alt=""
  >

  <div class="overlay"></div>

  <main
    id="stage"
    class="stage"
  >

    <div class="halo"></div>

    <div class="message-wrap">
      <div
        id="message"
        class="message"
      ></div>

      <div class="rule"></div>
    </div>

  </main>

  <div class="vignette"></div>

  <script>
    const backgroundImage =
      document.getElementById("backgroundImage");

    const messageElement =
      document.getElementById("message");

    const stage =
      document.getElementById("stage");

    let hideTimer = null;
    let lastMessageId = null;
    let lastBackground = null;

    function setBackground(url) {
      if (!url) {
        backgroundImage.removeAttribute("src");
        return;
      }

      backgroundImage.src = url;
    }

    function escapeHtml(text) {
      return String(text).replace(
        /[&<>'"]/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"
        })[character]
      );
    }

    function showMessage(message) {
      clearTimeout(hideTimer);

      messageElement.className = "message";

      messageElement.innerHTML =
        escapeHtml(message.text);

      stage.classList.add(
        "has-message"
      );

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          messageElement.classList.add(
            "show"
          );
        });
      });
    }

    function hideMessage() {
      clearTimeout(hideTimer);

      messageElement.classList.remove(
        "show"
      );

      messageElement.classList.add(
        "hide"
      );

      stage.classList.remove(
        "has-message"
      );

      hideTimer = setTimeout(() => {
        messageElement.textContent = "";
        messageElement.className =
          "message";
      }, 1000);
    }

    async function sync() {
      try {
        const response =
          await fetch(
            "/api/public-state?t=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          return;
        }

        const state =
          await response.json();

        if (
          state.background !==
          lastBackground
        ) {
          lastBackground =
            state.background;

          setBackground(
            state.background
          );
        }

        const currentMessageId =
          state.activeMessage?.id ||
          null;

        if (
          currentMessageId !==
          lastMessageId
        ) {
          lastMessageId =
            currentMessageId;

          if (state.activeMessage) {
            showMessage(
              state.activeMessage
            );
          } else {
            hideMessage();
          }
        }
      } catch (error) {
        console.error(
          "Ошибка синхронизации:",
          error
        );
      }
    }

    sync();

    setInterval(
      sync,
      700
    );
  </script>

</body>
</html>
