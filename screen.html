<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wedding Screen Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #info {
      position: fixed;
      z-index: 100;
      left: 20px;
      right: 20px;
      bottom: 20px;
      padding: 18px;
      background: rgba(0,0,0,.85);
      color: white;
      font: 16px Arial, sans-serif;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <img id="photo" alt="">
  <div id="info">Запуск...</div>

  <script>
    const photo = document.getElementById('photo');
    const info = document.getElementById('info');

    async function run() {
      try {
        const response = await fetch(
          '/api/public-state?t=' + Date.now(),
          { cache: 'no-store' }
        );

        const state = await response.json();
        const url = state.background;

        info.innerHTML =
          'URL получен:<br><br>' +
          url +
          '<br><br>Ждём загрузку картинки...';

        photo.onload = function () {
          info.innerHTML =
            '✅ КАРТИНКА ЗАГРУЗИЛАСЬ' +
            '<br><br>Размер: ' +
            photo.naturalWidth +
            ' × ' +
            photo.naturalHeight;
        };

        photo.onerror = function () {
          info.innerHTML =
            '❌ КАРТИНКА НЕ ЗАГРУЗИЛАСЬ' +
            '<br><br>' +
            url;
        };

        photo.src = url;

      } catch (error) {
        info.innerHTML =
          '❌ ОШИБКА API:<br><br>' +
          error.message;
      }
    }

    run();
  </script>

</body>
</html>
